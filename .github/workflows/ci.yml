name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m ruff check src/electrical_kaoyan/hotspots.py src/electrical_kaoyan/webapp.py src/electrical_kaoyan/cli.py tests/test_hotspots.py tests/test_cli.py

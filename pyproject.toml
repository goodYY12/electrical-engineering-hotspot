[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "electrical-kaoyan-navigator"
version = "0.4.0"
description = "Auditable research tooling for electrical engineering postgraduate admissions in mainland China"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
  "typer>=0.12"
]

[project.optional-dependencies]
pdf = ["pdfplumber>=0.11"]
browser = ["playwright>=1.49"]
ocr = ["pytesseract>=0.3.13", "Pillow>=10.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "respx>=0.21", "ruff>=0.8"]

[project.scripts]
electrical-kaoyan = "electrical_kaoyan.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/electrical_kaoyan"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "electrical_kaoyan/web"

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
  "integration: deterministic integration tests without live websites",
  "live: opt-in tests that access current public websites"
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
